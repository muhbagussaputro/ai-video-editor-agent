services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-video-clipper-app
    working_dir: /app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ${VIDEO_DIR:-/data/videos}:/data/videos
      - ${WORK_DIR:-/data/work}:/data/work
      - ${LOG_DIR:-/data/logs}:/data/logs
      - ${CACHE_DIR:-/data/cache}:/data/cache
      - /home/bismillah/.mozilla/firefox:/root/.mozilla/firefox:ro
    restart: unless-stopped
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-video-clipper-worker
    working_dir: /app
    command: ["python", "-m", "worker.worker"]
    env_file:
      - .env
    volumes:
      - ./:/app
      - ${VIDEO_DIR:-/data/videos}:/data/videos
      - ${WORK_DIR:-/data/work}:/data/work
      - ${LOG_DIR:-/data/logs}:/data/logs
      - ${CACHE_DIR:-/data/cache}:/data/cache
      - /home/bismillah/.mozilla/firefox:/root/.mozilla/firefox:ro
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: ai-video-clipper-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
